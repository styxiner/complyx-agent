[package]
name = "grpc-client"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["time", "fs"] }
rcgen = "0.14.7"
proto = { path = "../proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
rustls = "0.23.40"
rustls-pemfile = "2"
tonic = { version = "0.12.3", features = ["transport", "tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
