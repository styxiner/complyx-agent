[package]
name = "grpc-client"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["time", "fs"] }
rcgen = "0.13"
proto = { path = "../proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
rustls = "0.23.40"
tonic = "0.14.5"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
