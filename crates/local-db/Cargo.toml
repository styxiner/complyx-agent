[package]
name = "local-db"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlx = {version = "0.7", features = [
  "sqlite",
  "runtime-tokio",
  "macros",
  "uuid",
  "chrono",
  "migrate",
]}

proto = { path = "../proto" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

thiserror = "1"
tracing = "0.1"

tokio = { version = "1", features = ["fs"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
