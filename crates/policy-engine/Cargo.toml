[package]
name = "policy-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["fs", "process"] }
async-trait = "0.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

regex = "1"

thiserror = "1"
tracing = "0.1"
chrono = "0.4"

proto = { path = "../proto" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
